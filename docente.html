<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Aulas UMA - Estudiante</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav>
        <div style="color:var(--uma-gold); font-weight:bold;">👨‍🎓 Estudiante</div>
        <div>Horarios de la semana:</div>
        <button onclick="toggleSchedule()" id="max-btn">
            <i class="fas fa-expand"></i> <span id="btn-text">Maximizar 3D</span>
        </button>
    </nav>

    <div class="filter-panel">
        <label>FILTRAR CARRERA</label>
        <select id="carrera-select" onchange="updateSchedule()">
            <option value="all">Todas las Carreras</option>
            <option value="lic">Licenciatura en Informática</option>
            <option value="tecn">Técnico en Software</option>
        </select>
    </div>

    <div class="legend">
        <div><span style="background:#00f2ff"></span> Planta Activa</div>
        <div><span style="background:#ffea00"></span> Aula Seleccionada</div>
        <div><span style="background:#ff3e3e"></span> Escaleras</div>
    </div>

    <div id="canvas-container"></div>
    <div id="schedule-drawer">
        <div class="schedule-grid" id="grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
